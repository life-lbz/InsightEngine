global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # ── 教育答疑 API ──
  - job_name: "insight-engine-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "insight-engine-api"
          env: "prod"

  # ── MySQL Exporter ──
  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]

  # ── Redis Exporter ──
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── Milvus ──
  - job_name: "milvus"
    static_configs:
      - targets: ["milvus:9091"]