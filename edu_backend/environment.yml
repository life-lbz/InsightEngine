# ============================================================
# insight-engine Conda 环境依赖文件
# Python 3.12 | 适用于在线教育答疑 RAG 生产级系统
#
# 创建环境：conda env create -f environment.yml
# 更新依赖：conda env update -f environment.yml --prune
# 激活环境：conda activate insightengine
# ============================================================

name: insightengine

channels:
  - conda-forge
  - pytorch
  - nodefaults

dependencies:
  # ── Python 解释器 ──
  - python=3.12

  # ── Web 框架 ──
  - fastapi>=0.109.0
  - uvicorn>=0.27.0
  - python-multipart>=0.0.6          # FastAPI 文件上传支持

  # ── 配置与数据验证 ──
  - pydantic>=2.5.0
  - pydantic-settings>=2.1.0

  # ── 数据库 ──
  - sqlalchemy>=2.0.25
  - pymysql>=1.1.0                   # MySQL 同步驱动
  - alembic>=1.13.0                  # 数据库迁移

  # ── 缓存与消息 ──
  - redis-py>=5.0.0

  # ── HTTP 客户端 ──
  - httpx>=0.26.0

  # ── 可观测性 ──
  - structlog>=24.1.0
  - prometheus_client>=0.19.0

  # ── 安全 ──
  - pyjwt>=2.8.0

  # ── 重试机制 ──
  - tenacity>=8.2.3

  # ── 数据处理 ──
  - pandas>=2.2.0
  - openpyxl>=3.1.2                  # Excel 读取
  - pdfplumber>=0.10.0               # PDF 读取
  - python-docx>=1.1.0               # Word 文档读取
  - python-pptx>=0.6.23              # PPT 读取
  - chardet>=5.2.0                   # 编码检测
  - pyyaml>=6.0.1                    # YAML 配置文件

  # ── 深度学习基础（conda 安装保证 CUDA 兼容）──
  - pytorch>=2.1.0
  - numpy>=1.26.0

  # ── 测试 ──
  - pytest>=8.0.0
  - pytest-asyncio>=0.23.0
  - pytest-cov>=4.1.0

  # ── 代码质量与安全 ──
  - mypy>=1.8.0
  - ruff>=0.2.0
  - bandit>=1.7.7

  # ── pip 依赖（conda-forge 上不可用或需特定版本）──
  - pip>=24.0
  - pip:
      # LLM 与 LangChain 生态（精确锁定版本，保证构建可复现）
      - langchain-core==0.3.10
      - langchain-openai==0.3.0
      - openai==1.54.0
      # 多 Agent 协作（LangGraph 编排）
      - langgraph==0.2.39
      - langgraph-supervisor==0.0.4
      - langgraph-checkpoint-redis==0.1.1
      # MCP 协议（外部能力标准化暴露）
      - langchain-mcp-adapters==0.2.0
      - mcp==1.0.0

      # BGE-M3 Embedding + BGE-Reranker
      - FlagEmbedding==1.2.10

      # 意图分类（BERT，与 torch 配合使用）
      - transformers==4.44.2

      # RAG 效果评估数据集（scripts/rag_eval.py 使用）
      - datasets==3.0.1
      # 可选：ragas==0.1.19（RAGAS 精确评估。依赖 langchain 全家桶且无版本上限，
      # 会与本环境的 langchain-core 0.1.x 冲突，请单独建评估环境；未安装时
      # rag_eval.py 自动降级为启发式评估）

      # 向量存储（conda-forge 无 2.3.x 版本，故走 pip）
      - pymilvus==2.3.7

      # pymilvus 2.3.x 兼容性：marshmallow 4.x 移除 __version_info__，需 <4
      - marshmallow==3.22.0

      # 依赖审计
      - pip-audit==2.7.3
