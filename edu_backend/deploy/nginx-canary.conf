# 教育答疑 RAG 灰度发布 Nginx 配置

upstream insight_engine_stable {
    server 127.0.0.1:8001 weight=90;
    # 稳定版本：接收 90% 流量
}

upstream insight_engine_canary {
    server 127.0.0.1:8002 weight=10;
    # 灰度版本：接收 10% 流量
}

server {
    listen 80;
    server_name api.insight-engine.example.com;

    # 健康检查端点（不参与灰度切分）
    location /health {
        proxy_pass http://insight_engine_stable;
    }

    # WebSocket 答疑流式接口
    location /api/v1/stream {
        # 按 IP+UA 随机分流
        split_clients "${remote_addr}${http_user_agent}" $backend {
            10%  insight_engine_canary;
            *    insight_engine_stable;
        }
        proxy_pass http://$backend;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-ID $request_id;

        # 超时设置（WebSocket 长连接）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其他 API 接口
    location /api/ {
        split_clients "${remote_addr}${http_user_agent}" $backend {
            10%  insight_engine_canary;
            *    insight_engine_stable;
        }
        proxy_pass http://$backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-ID $request_id;
    }

    # Prometheus 指标端点（仅内网访问）
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://insight_engine_stable;
    }
}